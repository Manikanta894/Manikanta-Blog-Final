# MANII'S JOURNAL — full self-hosted stack.
# Usage:
#   cp .env.example .env && edit .env
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
#
# Services:
#   web       — Next.js app (this repo)
#   postgres  — primary database (use this OR Supabase self-host — see docs)
#   typesense — full-text search
#   n8n       — automation workflows
#   umami     — self-hosted analytics (+ its own postgres)
#   mongodb   — optional, only if DB_DRIVER=mongo (kept for migration)

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: manii
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: manii_journal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../packages/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../packages/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manii -d manii_journal"]
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:0.25.2
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /data
    volumes:
      - typesense_data:/data
    ports:
      - "8108:8108"
    command: '--data-dir /data --api-key=${TYPESENSE_API_KEY:-changeme} --enable-cors'

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      GENERIC_TIMEZONE: UTC
      N8N_SECURE_COOKIE: 'false'
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
      POSTGRES_DB: umami
    volumes:
      - umami_db_data:/var/lib/postgresql/data

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      - umami-db
    environment:
      DATABASE_URL: postgres://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-please_change_me_at_least_32_chars_x}
    ports:
      - "3001:3000"

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../.env
    environment:
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  typesense_data:
  n8n_data:
  umami_db_data:
  mongo_data:
